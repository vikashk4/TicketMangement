<div class="board-container" [class.dragging]="isDragging">
    <header class="board-header">
      <h1>Ticket Board</h1>
      <button class="btn btn-primary" (click)="toggleTicketForm()">
        {{ showTicketForm ? 'Close Form' : 'Create Ticket' }}
      </button>
    </header>
    
    <!-- Popup Overlay -->
    <div class="popup-overlay" *ngIf="showTicketForm" (click)="closePopupOnOverlayClick($event)">
      <div class="popup-content">
        <div class="popup-header">
          <h2>Create New Ticket</h2>
          <button class="btn-close" (click)="toggleTicketForm()">×</button>
        </div>
        <app-ticket-form (ticketSubmit)="onTicketSubmit($event)"></app-ticket-form>
      </div>
    </div>

    <div class="board" cdkDropListGroup >
      <div *ngFor="let column of boardColumns" class="board-column" [class.blur-column]="isDragging">
        <h2>{{ column.label }}</h2>
        <div
          cdkDropList
          [cdkDropListData]="column.tickets"
          class="ticket-list"
          (cdkDropListDropped)="drop($event)"
          [id]="column.status"
        >`
          <div *ngFor="let ticket of column.tickets" class="ticket-card" cdkDrag>
            <div class="ticket-wrap">
              <div class="ticket">
            <h3>{{ ticket.title }}</h3>
            <p>{{ ticket.description }}</p>
            <div class="ticket-meta">
              <span [class]="'priority-' + ticket.priority.toLowerCase()">{{ ticket.priority }}</span>
              <span class="assignee">{{ ticket.assignee }}</span>
            </div>
          </div>
            </div>
          </div>
        </div>
      </div>
    </div>
